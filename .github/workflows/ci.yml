name: Node 22 gates
on:
  push:
    branches: [feature/phase1.5/mermail-autonomous-onboarding]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run demo
      - run: npm run demo -- --link --reuse
